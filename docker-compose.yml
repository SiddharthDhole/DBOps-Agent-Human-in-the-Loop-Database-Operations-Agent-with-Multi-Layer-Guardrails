  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    container_name: postgres_chat_agent
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass@1234
      POSTGRES_DB: dbops_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "dbops_demo" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  # redis_data:
  postgres_data:
